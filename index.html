<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おはぎチェック表</title>
<style>
:root{
  --bg:#f6f1ec; --card:#fffdfb; --ink:#3c332d; --sub:#7b6d63;
  --accent:#9a7554; --accent2:#eaded3; --danger:#b85d58; --line:#e8ddd5;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}
main{max-width:680px;margin:auto;padding:18px 12px 42px}
h1{text-align:center;margin:3px 0 4px;font-size:27px}
.lead{text-align:center;color:var(--sub);margin:0 0 14px;font-size:14px}
.card{
  background:var(--card);border-radius:18px;padding:12px;
  box-shadow:0 3px 16px rgba(60,45,35,.06);
}
.item{
  display:grid;
  grid-template-columns:42px minmax(135px,1fr) 106px 28px;
  gap:6px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)
}
.item:last-child{border-bottom:0}
.check{
  appearance:none;width:36px;height:36px;border:2px solid #bca997;border-radius:10px;
  background:white;position:relative;margin:auto;
}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked:after{
  content:"";position:absolute;left:10px;top:4px;width:10px;height:18px;
  border:solid white;border-width:0 4px 4px 0;transform:rotate(45deg)
}
.name{
  width:100%;min-width:0;border:1px solid #d8cbc0;border-radius:12px;
  padding:11px 10px;font-size:17px;background:white;color:var(--ink)
}
.qtybox{display:grid;grid-template-columns:32px 38px 32px;gap:2px;align-items:center}
.step{
  height:36px;border:0;border-radius:9px;background:var(--accent2);
  font-size:22px;font-weight:700;color:var(--ink);padding:0
}
.qty{
  width:38px;height:36px;text-align:center;border:1px solid #d8cbc0;border-radius:9px;
  font-size:17px;color:var(--ink);background:white;padding:0
}
.remove{border:0;background:transparent;color:var(--danger);font-size:25px;font-weight:700;padding:0}
.wide,.actions button,.print{
  border:0;border-radius:13px;font-weight:700;color:var(--ink);background:var(--accent2)
}
.wide{width:100%;padding:15px;margin-top:12px;font-size:17px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}
.actions button{padding:12px 5px;font-size:14px}
h2{font-size:17px;margin:17px 2px 7px}
.preview{
  white-space:pre-wrap;background:white;border:1px dashed #cbb9aa;border-radius:14px;
  min-height:90px;padding:13px;font-size:17px;line-height:1.5
}
.print{
  width:100%;padding:17px;margin-top:13px;background:var(--accent);color:white;font-size:19px
}
.print:disabled{opacity:.45}
.note{font-size:13px;color:var(--sub);line-height:1.5;margin:9px 3px}
@media(max-width:390px){
  .item{grid-template-columns:40px minmax(125px,1fr) 100px 26px;gap:4px}
  .name{font-size:16px;padding:10px 8px}
  .qtybox{grid-template-columns:30px 36px 30px}
  .step{height:34px;font-size:21px}
  .qty{width:36px;height:34px}
}
</style>
</head>
<body>
<main>
<h1>おはぎチェック表</h1>
<p class="lead">印刷する商品を選び、数量を入力してください</p>

<section class="card">
  <div id="items"></div>
  <button class="wide" id="add" type="button">＋ 商品を追加</button>
</section>

<div class="actions">
  <button id="all" type="button">すべて選択</button>
  <button id="none" type="button">選択解除</button>
  <button id="reset" type="button">初期に戻す</button>
</div>

<h2>印刷内容</h2>
<div id="preview" class="preview"></div>
<button id="print" class="print" type="button">Smooth Printで印刷</button>
<p class="note">チェックを付けた商品を、数量0でも印刷できます。初期数量はすべて0です。</p>
</main>

<script>
const initialNames = [
  "つぶあん","こしあん","きなこ","みたらし","宇治抹茶","ココナッツ",
  "黒ごま","かぼちゃ","落花生","枝豆","うぐいす","よもぎ"
];

// 前の版の保存内容と混ざらないよう、保存名を変更
const STORAGE_KEY = "yobukodori-checklist-v4";
let data;

function freshData(){
  return initialNames.map(name => ({name, checked:true, qty:0}));
}

try{
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
  data = Array.isArray(saved) && saved.length
    ? saved.map(x => ({
        name: String(x.name ?? ""),
        checked: x.checked !== false,
        qty: Math.max(0, Math.min(999, parseInt(x.qty,10) || 0))
      }))
    : freshData();
}catch(e){
  data = freshData();
}

const items = document.getElementById("items");
const preview = document.getElementById("preview");
const printBtn = document.getElementById("print");

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function printableItems(){
  return data.filter(x => x.checked && x.name.trim());
}

function buildPrintText(){
  return printableItems()
    .map(x => {
      const fullWidthQty = String(x.qty).replace(
        /[0-9]/g,
        d => "０１２３４５６７８９"[Number(d)]
      );
      return x.qty === 0 ? `□${x.name.trim()}` : `□${x.name.trim()} ${fullWidthQty}`;
    })
    .join("\n");
}

function updatePreview(){
  const text = buildPrintText();
  preview.textContent = text || "印刷する商品がありません";
  printBtn.disabled = !text;
  save();
}

function render(){
  items.innerHTML = "";

  data.forEach((item, index) => {
    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = `
      <input class="check" type="checkbox" aria-label="印刷する">
      <input class="name" type="text" aria-label="商品名">
      <div class="qtybox">
        <button class="step minus" type="button" aria-label="1減らす">−</button>
        <input class="qty" type="number" min="0" max="999" inputmode="numeric" aria-label="数量">
        <button class="step plus" type="button" aria-label="1増やす">＋</button>
      </div>
      <button class="remove" type="button" aria-label="削除">×</button>
    `;

    const check = row.querySelector(".check");
    const name = row.querySelector(".name");
    const qty = row.querySelector(".qty");

    check.checked = item.checked;
    name.value = item.name;
    qty.value = item.qty;

    check.addEventListener("change", () => {
      item.checked = check.checked;
      updatePreview();
    });

    name.addEventListener("input", () => {
      item.name = name.value;
      updatePreview();
    });

    qty.addEventListener("input", () => {
      item.qty = Math.max(0, Math.min(999, parseInt(qty.value,10) || 0));
      qty.value = item.qty;
      updatePreview();
    });

    row.querySelector(".minus").addEventListener("click", () => {
      item.qty = Math.max(0, item.qty - 1);
      qty.value = item.qty;
      updatePreview();
    });

    row.querySelector(".plus").addEventListener("click", () => {
      item.qty = Math.min(999, item.qty + 1);
      qty.value = item.qty;
      updatePreview();
    });

    row.querySelector(".remove").addEventListener("click", () => {
      if(confirm(`「${item.name}」を削除しますか？`)){
        data.splice(index,1);
        render();
      }
    });

    items.appendChild(row);
  });

  updatePreview();
}

document.getElementById("add").addEventListener("click", () => {
  data.push({name:"新しい商品", checked:true, qty:0});
  render();
  setTimeout(() => items.lastElementChild?.querySelector(".name")?.select(), 0);
});

document.getElementById("all").addEventListener("click", () => {
  data.forEach(x => x.checked = true);
  render();
});

document.getElementById("none").addEventListener("click", () => {
  data.forEach(x => x.checked = false);
  render();
});

document.getElementById("reset").addEventListener("click", () => {
  if(confirm("商品名と数量を初期状態に戻しますか？")){
    data = freshData();
    render();
  }
});

printBtn.addEventListener("click", () => {
  const text = buildPrintText();
  if(!text) return;

  const base = new URL(".", location.href).href;
  const paramObj = {
    filename: new URL("checklist20260725_v2.lbx", base).href,
    size: new URL("RD50x30_20260725.bin", base).href,
    copies: "1",
    text_ITEM1: text
  };

  const queryString = Object.entries(paramObj)
    .map(([key, value]) => `${key}=${encodeURIComponent(value)}`)
    .join("&");

  location.href = "brotherwebprint://print?" + queryString;
});

render();
</script>
</body>
</html>
